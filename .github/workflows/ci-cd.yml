name: CI/CD

on:
  pull_request:
    branches:
      - dev
      - staging
      - main
  push:
    branches:
      - dev
      - staging
      - main

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint:check

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: checks
    if: github.event_name == 'push'
    environment: ${{ github.ref_name == 'main' && 'production' || github.ref_name }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure deployment target
        run: |
          if [ -z "${{ vars.APP_PATH }}" ]; then
            echo "APP_PATH environment variable is required."
            exit 1
          fi

          if [ -z "${{ vars.APP_NAME }}" ]; then
            echo "APP_NAME environment variable is required."
            exit 1
          fi

          echo "APP_PATH=${{ vars.APP_PATH }}" >> "$GITHUB_ENV"
          echo "APP_NAME=${{ vars.APP_NAME }}" >> "$GITHUB_ENV"

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.HOST }}" >> ~/.ssh/known_hosts

      - name: Create app directory
        run: |
          ssh -i ~/.ssh/deploy_key "${{ secrets.USERNAME }}@${{ secrets.HOST }}" \
            "mkdir -p '${{ env.APP_PATH }}'"

      - name: Copy project files
        run: |
          rsync -az --delete \
            --exclude=".git" \
            --exclude="node_modules" \
            --exclude="dist" \
            --exclude=".env" \
            -e "ssh -i ~/.ssh/deploy_key" \
            ./ "${{ secrets.USERNAME }}@${{ secrets.HOST }}:${{ env.APP_PATH }}/"

      - name: Install, build, and restart app
        run: |
          ssh -i ~/.ssh/deploy_key "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
            "set -e
            cd '${{ env.APP_PATH }}'
            if [ ! -f .env ]; then
              echo '.env file is missing on the server.'
              exit 1
            fi
            corepack enable
            pnpm install --frozen-lockfile --prod=false
            pnpm build
            pm2 restart '${{ env.APP_NAME }}' || pm2 start pnpm --name '${{ env.APP_NAME }}' -- start:prod
            pm2 save"
