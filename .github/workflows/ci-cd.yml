name: CI/CD

on:
  pull_request:
    branches:
      - dev
      - staging
      - main
  push:
    branches:
      - dev
      - staging
      - main

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint:check

      # - name: Test
      #   run: pnpm test

      - name: Build
        run: pnpm build

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: checks
    if: github.event_name == 'push'
    environment: ${{ github.ref_name == 'main' && 'production' || github.ref_name }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure deployment target
        run: |
          if [ -z "${{ vars.APP_PATH }}" ]; then
            echo "APP_PATH environment variable is required."
            exit 1
          fi

          if [ -z "${{ vars.APP_NAME }}" ]; then
            echo "APP_NAME environment variable is required."
            exit 1
          fi

          echo "APP_PATH=${{ vars.APP_PATH }}" >> "$GITHUB_ENV"
          echo "APP_NAME=${{ vars.APP_NAME }}" >> "$GITHUB_ENV"

      - name: Create app directory
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          script: mkdir -p "${{ env.APP_PATH }}"

      - name: Clean app directory
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            find "${{ env.APP_PATH }}" -mindepth 1 \
              -maxdepth 1 \
              ! -name ".env" \
              ! -name "node_modules" \
              -exec rm -rf {} +

      - name: Copy project files
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          source: "."
          target: ${{ env.APP_PATH }}
          overwrite: true
          strip_components: 0
          exclude: ".git,node_modules,dist,.env"

      - name: Install, build, and restart app
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            set -e
            cd "${{ env.APP_PATH }}"
            if [ ! -f .env ]; then
              echo ".env file is missing on the server."
              exit 1
            fi
            corepack enable
            corepack prepare pnpm@9.15.9 --activate
            pnpm --version

            pnpm install --frozen-lockfile --prod=false
            pnpm build
            pm2 restart "${{ env.APP_NAME }}" || pm2 start pnpm --name "${{ env.APP_NAME }}" -- start:prod
            pm2 save
