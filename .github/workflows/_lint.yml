name: _lint

on:
  workflow_call:
    inputs:
      node_version:
        description: 'Node.js version to use'
        required: false
        type: string
        default: '22'
  workflow_dispatch:
    inputs:
      node_version:
        description: 'Node.js version to use'
        required: false
        type: string
        default: '22'

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node_version || '22' }}
          # cache: pnpm removed

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile --include=dev --ignore-scripts
        env:
          PNPM_FETCH_RETRIES: 3
          PNPM_FETCH_RETRY_MINTIMEOUT: 10000
          PNPM_FETCH_TIMEOUT: 120000

      - name: Lint code
        run: pnpm run lint
