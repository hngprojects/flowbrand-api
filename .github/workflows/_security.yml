name: _security

on:
    workflow_call:
    workflow_dispatch:

jobs:
    audit:
        name: Dependency Audit
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup pnpm
              uses: pnpm/action-setup@v4
              with:
                  version: latest

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: ${{ vars.NODE_VERSION || '20' }}
                  cache: pnpm

            - name: Install dependencies
              run: pnpm install

            - name: Run pnpm audit
              run: pnpm audit --audit-level=high

    secret-scan:
        name: Secret Scan (TruffleHog)
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Run TruffleHog
              uses: trufflesecurity/trufflehog@v3.88.0
              with:
                  extra_args: --only-verified

    trivy-scan:
        name: Vulnerability Scan (Trivy)
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Run Trivy (filesystem)
              uses: aquasecurity/trivy-action@0.30.0
              with:
                  scan-type: fs
                  scan-ref: .
                  severity: HIGH,CRITICAL
                  exit-code: 1
                  ignore-unfixed: true
                  format: table
